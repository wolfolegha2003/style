<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест API - Nail & Style</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>🧪 Тест API Nail & Style</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Аутентификация</h3>
                
                <div class="card mb-3">
                    <div class="card-header">Регистрация</div>
                    <div class="card-body">
                        <button id="testRegister" class="btn btn-primary">Тест регистрации</button>
                        <div id="registerResult" class="mt-2"></div>
                    </div>
                </div>
                
                <div class="card mb-3">
                    <div class="card-header">Вход</div>
                    <div class="card-body">
                        <button id="testLogin" class="btn btn-success">Тест входа</button>
                        <div id="loginResult" class="mt-2"></div>
                    </div>
                </div>
                
                <div class="card mb-3">
                    <div class="card-header">Профиль</div>
                    <div class="card-body">
                        <button id="testProfile" class="btn btn-info">Получить профиль</button>
                        <div id="profileResult" class="mt-2"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Записи</h3>
                
                <div class="card mb-3">
                    <div class="card-header">Услуги и мастера</div>
                    <div class="card-body">
                        <button id="testServices" class="btn btn-warning">Получить услуги</button>
                        <button id="testMasters" class="btn btn-warning">Получить мастеров</button>
                        <div id="servicesResult" class="mt-2"></div>
                    </div>
                </div>
                
                <div class="card mb-3">
                    <div class="card-header">Доступные слоты</div>
                    <div class="card-body">
                        <button id="testSlots" class="btn btn-secondary">Слоты на завтра</button>
                        <div id="slotsResult" class="mt-2"></div>
                    </div>
                </div>
                
                <div class="card mb-3">
                    <div class="card-header">Создать запись</div>
                    <div class="card-body">
                        <button id="testBooking" class="btn btn-danger">Тест записи</button>
                        <div id="bookingResult" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <hr>
        <h3>Лог результатов</h3>
        <div id="testLog" class="alert alert-light" style="height: 300px; overflow-y: scroll; font-family: monospace;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api-client.js"></script>
    
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // Тест регистрации
        document.getElementById('testRegister').onclick = async () => {
            try {
                log('Тестируем регистрацию...');
                const userData = {
                    name: 'Тест Пользователь',
                    email: 'test' + Date.now() + '@example.com',
                    password: 'password123',
                    phone: '+79991234567'
                };
                
                const response = await ApiClient.auth.register(userData);
                log('✅ Регистрация успешна: ' + JSON.stringify(response), 'success');
                document.getElementById('registerResult').innerHTML = '<div class="alert alert-success">Успешно!</div>';
            } catch (error) {
                log('❌ Ошибка регистрации: ' + error.message, 'error');
                document.getElementById('registerResult').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
            }
        };
        
        // Тест входа
        document.getElementById('testLogin').onclick = async () => {
            try {
                log('Тестируем вход...');
                const response = await ApiClient.auth.login('admin@nailstyle-sev.ru', 'admin123');
                log('✅ Вход успешен: ' + JSON.stringify(response), 'success');
                document.getElementById('loginResult').innerHTML = '<div class="alert alert-success">Вход выполнен!</div>';
            } catch (error) {
                log('❌ Ошибка входа: ' + error.message, 'error');
                document.getElementById('loginResult').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
            }
        };
        
        // Тест профиля
        document.getElementById('testProfile').onclick = async () => {
            try {
                log('Получаем профиль...');
                const response = await ApiClient.auth.getProfile();
                log('✅ Профиль получен: ' + JSON.stringify(response), 'success');
                document.getElementById('profileResult').innerHTML = '<div class="alert alert-success">Профиль получен!</div>';
            } catch (error) {
                log('❌ Ошибка получения профиля: ' + error.message, 'error');
                document.getElementById('profileResult').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
            }
        };
        
        // Тест услуг
        document.getElementById('testServices').onclick = async () => {
            try {
                log('Получаем услуги...');
                const response = await ApiClient.bookings.getServices();
                log('✅ Услуги получены: ' + response.services.length + ' шт.', 'success');
                document.getElementById('servicesResult').innerHTML = '<div class="alert alert-success">Услуги: ' + response.services.length + '</div>';
            } catch (error) {
                log('❌ Ошибка получения услуг: ' + error.message, 'error');
                document.getElementById('servicesResult').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
            }
        };
        
        // Тест мастеров
        document.getElementById('testMasters').onclick = async () => {
            try {
                log('Получаем мастеров...');
                const response = await ApiClient.bookings.getMasters();
                log('✅ Мастера получены: ' + response.masters.length + ' чел.', 'success');
                document.getElementById('servicesResult').innerHTML += '<div class="alert alert-success">Мастера: ' + response.masters.length + '</div>';
            } catch (error) {
                log('❌ Ошибка получения мастеров: ' + error.message, 'error');
                document.getElementById('servicesResult').innerHTML += '<div class="alert alert-danger">' + error.message + '</div>';
            }
        };
        
        // Тест слотов
        document.getElementById('testSlots').onclick = async () => {
            try {
                log('Получаем слоты на завтра...');
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const dateStr = tomorrow.toISOString().split('T')[0];
                
                const response = await ApiClient.bookings.getAvailableSlots(dateStr);
                log('✅ Слоты получены: ' + response.available_slots.length + ' шт.', 'success');
                document.getElementById('slotsResult').innerHTML = '<div class="alert alert-success">Слоты: ' + response.available_slots.length + '</div>';
            } catch (error) {
                log('❌ Ошибка получения слотов: ' + error.message, 'error');
                document.getElementById('slotsResult').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
            }
        };
        
        // Тест записи
        document.getElementById('testBooking').onclick = async () => {
            try {
                log('Тестируем создание записи...');
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const dateStr = tomorrow.toISOString().split('T')[0];
                
                const bookingData = {
                    service_id: 1,
                    appointment_date: dateStr,
                    appointment_time: '14:00',
                    comment: 'Тестовая запись'
                };
                
                const response = await ApiClient.bookings.create(bookingData);
                log('✅ Запись создана: ' + JSON.stringify(response), 'success');
                document.getElementById('bookingResult').innerHTML = '<div class="alert alert-success">Запись создана!</div>';
            } catch (error) {
                log('❌ Ошибка создания записи: ' + error.message, 'error');
                document.getElementById('bookingResult').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
            }
        };
        
        log('🚀 Тестер API готов к работе!');
    </script>
</body>
</html>
